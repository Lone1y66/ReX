
name: ReX iOS IPA Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build ReX IPA
        run: |
          chmod +x ./gradlew
          bash ./rx-ios/app/build.sh device

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ReX-iPhone-IPA
          path: rx-ios/build/ReX.ipa
          if-no-files-found: error
